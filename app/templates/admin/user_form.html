{% extends "admin/_layout.html" %}
{% block title %}{{ "Edit User" if user else "Add User" }}{% endblock %}
{% block admin_content %}
<h1>{{ "Edit User" if user else "Add User" }}</h1>
<p><a href="{{ url_for('admin.users_list') }}">&larr; Back to users</a></p>

{% if error %}<p class="error">{{ error }}</p>{% endif %}

<form method="post">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <div class="form-group">
    <label for="name">Name</label>
    <input type="text" id="name" name="name" value="{{ form.name }}" required>
  </div>
  <div class="form-group">
    <label for="email">Email</label>
    <input type="email" id="email" name="email" value="{{ form.email }}" required>
  </div>
  <button type="submit">{{ "Save Changes" if user else "Add User" }}</button>
</form>
{% endblock %}

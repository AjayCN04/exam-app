{% extends "base.html" %}
{% block body_class %}admin{% endblock %}
{% block head_extra %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}">
{% endblock %}
{% block content %}
<nav class="admin-nav">
  <a class="brand" href="{{ url_for('admin.home') }}"><span class="mark"></span> Exam Admin</a>
  <a href="{{ url_for('admin.home') }}" class="{{ 'active' if request.endpoint == 'admin.home' }}">Home</a>
  <a href="{{ url_for('admin.exam_new') }}" class="{{ 'active' if request.endpoint == 'admin.exam_new' }}">Create Exam</a>
  <a href="{{ url_for('admin.exams_list') }}" class="{{ 'active' if request.endpoint in ('admin.exams_list', 'admin.exam_results', 'admin.participant_detail') }}">View Results</a>
  <a href="{{ url_for('admin.users_list') }}" class="{{ 'active' if request.endpoint in ('admin.users_list', 'admin.users_archived', 'admin.user_new', 'admin.user_edit') }}">Manage Users</a>
  <a href="{{ url_for('admin.logout') }}" class="nav-logout">Log out</a>
</nav>
{% block admin_content %}{% endblock %}
{% endblock %}
